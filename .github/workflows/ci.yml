name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow and action files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-jsonnet
      - uses: ./actions/setup-kubeconform
      - uses: ./actions/setup-vendir
      - uses: ./actions/setup-opentofu

  # Runs actions/kind-registry-mirror against a kind cluster and a local
  # zot pull-through cache on the kind network: no mirror, an unreachable
  # mirror, and a working one that each default registry is pulled
  # through.
  kind-registry-mirror:
    runs-on: ubuntu-latest
    env:
      CERTS_D: /etc/containerd/certs.d
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.15.1
        with:
          config: .github/tests/kind-registry-mirror/kind-config.yaml
          version: v0.33.0

      - name: Without a mirror
        uses: ./actions/kind-registry-mirror
      - name: Expect no mirror configuration
        run: |
          set -euo pipefail
          for node in $(kind get nodes --name chart-testing); do
            test -z "$(docker exec "$node" find "$CERTS_D" -name hosts.toml 2>/dev/null || true)"
          done

      - name: With an unreachable mirror
        uses: ./actions/kind-registry-mirror
        with:
          mirror: http://mirror.invalid:5000
          timeout: "3"
      - name: Expect no mirror configuration
        run: |
          set -euo pipefail
          for node in $(kind get nodes --name chart-testing); do
            test -z "$(docker exec "$node" find "$CERTS_D" -name hosts.toml 2>/dev/null || true)"
          done

      - name: Start zot as pull-through cache
        run: |
          set -euo pipefail
          docker run -d --name zot --network kind \
            -v "$PWD/.github/tests/kind-registry-mirror/zot-config.json:/etc/zot/config.json:ro" \
            ghcr.io/project-zot/zot-linux-amd64:v2.1.22 serve /etc/zot/config.json
          node="$(kind get nodes --name chart-testing | head -n 1)"
          for _ in $(seq 30); do
            docker exec "$node" curl -fsS -o /dev/null http://zot:5000/v2/ && exit 0
            sleep 2
          done
          docker logs zot
          exit 1

      - name: With a working mirror
        uses: ./actions/kind-registry-mirror
        with:
          mirror: http://zot:5000/
      - name: Expect images to be pulled through the mirror
        run: |
          set -euo pipefail
          node="$(kind get nodes --name chart-testing | tail -n 1)"
          docker exec "$node" sh -c "cat $CERTS_D/*/hosts.toml"
          images=(
            docker.io/library/busybox:1.37.0
            public.ecr.aws/docker/library/busybox:1.37.0
            quay.io/prometheus/busybox:latest
            ghcr.io/fluxcd/source-controller:v1.5.0
            registry.k8s.io/pause:3.10
          )
          for image in "${images[@]}"; do
            docker exec "$node" crictl pull "$image"
          done
          catalog="$(docker exec "$node" curl -fsS http://zot:5000/v2/_catalog)"
          echo "$catalog"
          for image in "${images[@]}"; do
            jq -e --arg repo "${image%:*}" '.repositories | index($repo)' <<< "$catalog" > /dev/null \
              || { echo "::error::$image was not pulled through the mirror"; exit 1; }
          done
      - name: Zot logs
        if: failure()
        run: docker logs zot

  # Runs actions/vendir-check against a fixture whose middle dependency has
  # its tag moved after it was locked: it must fail by default, pass when
  # that dependency is unpinned, and still fail on drift in the others.
  vendir-check-unpinned-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-vendir
      - run: .github/tests/vendir-check/fixture.sh "$RUNNER_TEMP/fixture"

      - name: Locked commit of a moved tag, nothing unpinned
        id: default
        continue-on-error: true
        uses: ./actions/vendir-check
        with:
          working-directory: ${{ runner.temp }}/fixture/work
      - name: Expect failure
        run: test "$OUTCOME" = failure
        env:
          OUTCOME: ${{ steps.default.outcome }}

      - name: Moved tag unpinned
        uses: ./actions/vendir-check
        with:
          working-directory: ${{ runner.temp }}/fixture/work
          unpinned-paths: vendor/example.com/moving

      - name: Drift in a pinned dependency
        run: |
          echo tampered > "$RUNNER_TEMP/fixture/work/vendor/example.com/pinned-a/file.txt"
          git -C "$RUNNER_TEMP/fixture/work" -c user.name=ci -c user.email=ci@example.com commit -qam tamper
      - name: Moved tag unpinned, others drifted
        id: drift
        continue-on-error: true
        uses: ./actions/vendir-check
        with:
          working-directory: ${{ runner.temp }}/fixture/work
          unpinned-paths: vendor/example.com/moving
      - name: Expect failure
        run: test "$OUTCOME" = failure
        env:
          OUTCOME: ${{ steps.drift.outcome }}
