name: "Jsonnet Lint"
description: "Runs jsonnet-lint over a directory tree of Jsonnet/libsonnet files."
inputs:
  path:
    description: "Root directory to search for Jsonnet files."
    required: false
    default: "."
  exclude-path:
    description: "A `find -not -path` glob to exclude (e.g. vendored dependencies)."
    required: false
    default: "./deps/*"
  extra-find-args:
    description: >
      Additional raw `find` predicates appended to the search, e.g.
      "-path './apps/*'" to further restrict which files are linted.
    required: false
    default: ""
  jsonnet-version:
    description: "go-jsonnet release version to install, without the leading 'v'. Leave empty to use setup-jsonnet's default."
    required: false
runs:
  using: "composite"
  steps:
    - if: inputs.jsonnet-version != ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
      with:
        version: ${{ inputs.jsonnet-version }}
    - if: inputs.jsonnet-version == ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
    - shell: bash
      run: |
        set -euo pipefail
        files=$(find "${{ inputs.path }}" -name '*.*sonnet' -not -path "${{ inputs.exclude-path }}" ${{ inputs.extra-find-args }})

        {
          echo "## Jsonnet Lint"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -z "$files" ]; then
          echo "No Jsonnet files found to lint."
          echo "No Jsonnet files found to lint." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        count=$(echo "$files" | wc -l)

        set +e
        lint_output=$(echo "$files" | xargs jsonnet-lint 2>&1)
        status=$?
        set -e
        echo "$lint_output"

        if [ "$status" -eq 0 ]; then
          echo "✅ Checked $count file(s) — no lint errors found." >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "❌ Checked $count file(s) — lint errors found."
            echo
            echo '```'
            echo "$lint_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"
