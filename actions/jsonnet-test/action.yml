name: "Jsonnet Test"
description: >
  Evaluates every *_test.jsonnet file under a directory tree (e.g. jsonnetunit
  style tests) and fails if any of them error out.
inputs:
  path:
    description: "Root directory to search for test files."
    required: false
    default: "."
  exclude-path:
    description: "A `find -not -path` glob to exclude (e.g. vendored dependencies)."
    required: false
    default: "./deps/*"
  jsonnet-version:
    description: "go-jsonnet release version to install, without the leading 'v'. Leave empty to use setup-jsonnet's default."
    required: false
runs:
  using: "composite"
  steps:
    - if: inputs.jsonnet-version != ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
      with:
        version: ${{ inputs.jsonnet-version }}
    - if: inputs.jsonnet-version == ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
    - shell: bash
      run: |
        set -euo pipefail
        status=0
        run=0
        failed=0
        failed_files=""
        files=$(find "${{ inputs.path }}" -name '*_test.jsonnet' -not -path "${{ inputs.exclude-path }}")

        {
          echo "## Jsonnet Test"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -z "$files" ]; then
          echo "No *_test.jsonnet files found."
          echo "No *_test.jsonnet files found." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        for f in $files; do
          echo "=== ${f} ==="
          run=$((run + 1))
          if ! jsonnet "${f}"; then
            status=1
            failed=$((failed + 1))
            failed_files="${failed_files}${f}"$'\n'
          fi
        done

        passed=$((run - failed))
        if [ "$status" -eq 0 ]; then
          echo "✅ $passed/$run tests passed." >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "❌ $passed/$run tests passed, $failed failed:"
            echo
            printf '%s' "$failed_files" | sed '/^$/d;s/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"
