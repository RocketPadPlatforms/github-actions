name: "Vendir Check"
description: >
  Verifies that a committed deps/vendor/ tree is a faithful, reproducible
  materialization of vendir.yml + vendir.lock.yml, by re-running `vendir sync
  -l` (locked mode, pinned to vendir.lock.yml) and failing on any diff.
  Before that, fails when a ref pinned in vendir.yml is not the one
  vendir.lock.yml records (a bump committed without `vendir sync`). Does
  not pick up upstream movement for mutable refs - that is a deliberate,
  separate action (bump the pin, run `vendir sync` without `-l`, review the
  diff).
inputs:
  working-directory:
    description: "Directory containing vendir.yml/vendir.lock.yml."
    required: false
    default: "deps"
  vendir-version:
    description: "vendir release version to install, without the leading 'v'. Leave empty to use setup-vendir's default."
    required: false
  github-token:
    description: >
      Optional token used to authenticate git fetches against github.com,
      for private dependencies vendir shells out to `git` for directly (and
      therefore doesn't inherit the runner's checkout credentials). Leave
      empty to rely on unauthenticated/public access.
    required: false
    default: ""
  github-api-token:
    description: >
      Token for vendir's GitHub API calls (githubRelease sources), to avoid
      the unauthenticated rate limit, which runners sharing an IP hit.
    required: false
    default: ${{ github.token }}
  setup:
    description: >
      Install vendir with setup-vendir and yq from its release. Set to
      "false" when both are already on PATH, e.g. from actions/nix-develop.
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - if: inputs.setup == 'true' && inputs.vendir-version != ''
      uses: RocketPadPlatforms/github-actions/actions/setup-vendir@v1
      with:
        version: ${{ inputs.vendir-version }}
    - if: inputs.setup == 'true' && inputs.vendir-version == ''
      uses: RocketPadPlatforms/github-actions/actions/setup-vendir@v1
    - if: inputs.setup != 'true'
      shell: bash
      run: |
        missing=0
        for tool in vendir yq; do
          if ! command -v "$tool" > /dev/null; then
            echo "::error::$tool is not on PATH. Install it first (e.g. with actions/nix-develop) or leave setup at \"true\"." >&2
            missing=1
          fi
        done
        exit "$missing"
    - name: Install yq 4.53.3
      if: inputs.setup == 'true'
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 sha=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4 ;;
          aarch64|arm64) arch=arm64 sha=578648e463a11c1b6db6010cbf41eafed6bee79466fcffa1bb446672cf7945ea ;;
          *)
            echo "::error::Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac
        mkdir -p "$RUNNER_TEMP/vendir-check/bin"
        curl -fsSL -o "$RUNNER_TEMP/vendir-check/bin/yq" \
          "https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_${arch}"
        echo "${sha}  $RUNNER_TEMP/vendir-check/bin/yq" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/vendir-check/bin/yq"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VENDIR_GITHUB_API_TOKEN: ${{ inputs.github-api-token }}
      run: |
        set -euo pipefail

        if [ -n "${{ inputs.github-token }}" ]; then
          git config --global url."https://x-access-token:${{ inputs.github-token }}@github.com/".insteadOf "https://github.com/"
        fi

        PATH="$RUNNER_TEMP/vendir-check/bin:$PATH" "$GITHUB_ACTION_PATH/check-refs.sh" vendir.yml vendir.lock.yml

        vendir sync -l

        changed_files=$(git diff --name-only -- vendor/ vendir.lock.yml)

        {
          echo "## Vendir Check"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$changed_files" ]; then
          git -c color.ui=always diff -- vendor/ vendir.lock.yml
          {
            echo "❌ Vendored directory has drifted:"
            echo
            echo "$changed_files" | sed 's/^/- `/;s/$/`/'
            echo
            echo "Run \`vendir sync\` and review/commit the diff."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "✅ Vendored directory matches \`vendir.lock.yml\` — no drift detected." >> "$GITHUB_STEP_SUMMARY"
