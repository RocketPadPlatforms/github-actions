name: "Vendir Check"
description: >
  Verifies that a committed deps/vendor/ tree is a faithful, reproducible
  materialization of vendir.yml + vendir.lock.yml, by re-running `vendir sync
  -l` (locked mode, pinned to vendir.lock.yml) and failing on any diff. Does
  not pick up upstream movement for mutable refs - that is a deliberate,
  separate action (bump the pin, run `vendir sync` without `-l`, review the
  diff).
inputs:
  working-directory:
    description: "Directory containing vendir.yml/vendir.lock.yml."
    required: false
    default: "deps"
  vendir-version:
    description: "vendir release version to install, without the leading 'v'. Leave empty to use setup-vendir's default."
    required: false
  github-token:
    description: >
      Optional token used to authenticate git fetches against github.com,
      for private dependencies vendir shells out to `git` for directly (and
      therefore doesn't inherit the runner's checkout credentials). Leave
      empty to rely on unauthenticated/public access.
    required: false
    default: ""
  git-url-prefix:
    description: >
      github.com URL prefix the github-token is used for. Defaults to
      https://github.com/<repository owner>/. Set it to https://github.com/
      for a token that also has to reach repositories of other owners. Only
      used when github-token is set.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - if: inputs.vendir-version != ''
      uses: RocketPadPlatforms/github-actions/actions/setup-vendir@v1
      with:
        version: ${{ inputs.vendir-version }}
    - if: inputs.vendir-version == ''
      uses: RocketPadPlatforms/github-actions/actions/setup-vendir@v1
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        GIT_URL_PREFIX_INPUT: ${{ inputs.git-url-prefix }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail

        if [ -n "$GITHUB_TOKEN_INPUT" ]; then
          # Hand the token to git through environment variables for this step
          # only. `git config --global` would write it into the global git
          # config, which persists on self-hosted runners: the token is
          # revoked when the job ends, but its rewrite rule stays and later
          # jobs pick it up first. A prefix that includes the owner is also
          # preferred over a leftover rule for plain https://github.com/.
          prefix="${GIT_URL_PREFIX_INPUT:-https://github.com/${REPOSITORY_OWNER}/}"
          case "$prefix" in
            https://github.com/*) ;;
            *) echo "::error::git-url-prefix must start with https://github.com/" >&2; exit 1 ;;
          esac

          index="${GIT_CONFIG_COUNT:-0}"
          export "GIT_CONFIG_KEY_${index}=url.https://x-access-token:${GITHUB_TOKEN_INPUT}@${prefix#https://}.insteadOf"
          export "GIT_CONFIG_VALUE_${index}=${prefix}"
          export GIT_CONFIG_COUNT=$((index + 1))
        fi

        vendir sync -l

        changed_files=$(git diff --name-only -- vendor/ vendir.lock.yml)

        {
          echo "## Vendir Check"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$changed_files" ]; then
          git -c color.ui=always diff -- vendor/ vendir.lock.yml
          {
            echo "❌ Vendored directory has drifted:"
            echo
            echo "$changed_files" | sed 's/^/- `/;s/$/`/'
            echo
            echo "Run \`vendir sync\` and review/commit the diff."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "✅ Vendored directory matches \`vendir.lock.yml\` — no drift detected." >> "$GITHUB_STEP_SUMMARY"
