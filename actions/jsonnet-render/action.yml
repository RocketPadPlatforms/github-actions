name: "Jsonnet Render"
description: "Renders a Jsonnet entrypoint file to JSON or a YAML stream."
inputs:
  file:
    description: "Path to the Jsonnet entrypoint file to render."
    required: true
  output-file:
    description: "Path to write the rendered output to. Defaults to '<file>.json'."
    required: false
    default: ""
  format:
    description: "Output format: 'yaml-stream' or 'json'."
    required: false
    default: "yaml-stream"
  args:
    description: "Extra raw arguments passed to `jsonnet` (e.g. '--tla-code root=true')."
    required: false
    default: ""
  jsonnet-version:
    description: "go-jsonnet release version to install, without the leading 'v'. Leave empty to use setup-jsonnet's default."
    required: false
outputs:
  output-file:
    description: "The path the rendered output was written to."
    value: ${{ steps.render.outputs.output-file }}
runs:
  using: "composite"
  steps:
    - if: inputs.jsonnet-version != ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
      with:
        version: ${{ inputs.jsonnet-version }}
    - if: inputs.jsonnet-version == ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
    - id: render
      shell: bash
      run: |
        set -euo pipefail

        out="${{ inputs.output-file }}"
        if [ -z "$out" ]; then
          out="${{ inputs.file }}.json"
        fi
        mkdir -p "$(dirname "$out")"

        format_flag="--yaml-stream"
        if [ "${{ inputs.format }}" = "json" ]; then
          format_flag=""
        fi

        jsonnet $format_flag --output-file "$out" ${{ inputs.args }} "${{ inputs.file }}"
        echo "output-file=$out" >> "$GITHUB_OUTPUT"
