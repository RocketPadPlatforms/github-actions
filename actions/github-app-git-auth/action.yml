name: "GitHub App Git Auth"
description: >
  Mints a short-lived installation token for a GitHub App and configures git
  to use it for github.com HTTPS fetches of the owner's repositories for the
  rest of the job (through GIT_CONFIG_* environment variables, nothing is
  written to the global git config), so later steps in the job
  (e.g. `tofu init` fetching a Terraform module, or any other plain `git`
  invocation) can access private repositories the App is installed on -
  without inheriting or leaking the current job's own checkout credentials.
inputs:
  app-id:
    description: "GitHub App ID."
    required: true
  private-key:
    description: "GitHub App private key (PEM)."
    required: true
  owner:
    description: "Owner (org or user) to scope the installation token to."
    required: false
    default: "RocketPadPlatforms"
  repositories:
    description: >
      Space-separated list of repository names (without the owner prefix)
      the token should be scoped to. The App must already be installed on
      these repositories.
    required: true
outputs:
  token:
    description: "The minted installation token, in case a step needs it directly (e.g. for the GitHub API)."
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: "composite"
  steps:
    - id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
    - shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
        OWNER: ${{ inputs.owner }}
      run: |
        set -euo pipefail

        # Export the rewrite rule to the later steps of this job through
        # GIT_CONFIG_* variables instead of `git config --global`. The global
        # git config persists on self-hosted runners: the token is revoked
        # when the job ends, but its rewrite rule would stay and later jobs
        # would pick it up first. The owner in the prefix also makes this
        # rule win over a leftover one for plain https://github.com/.
        prefix="https://github.com/${OWNER}/"
        index="${GIT_CONFIG_COUNT:-0}"
        {
          echo "GIT_CONFIG_KEY_${index}=url.https://x-access-token:${TOKEN}@github.com/${OWNER}/.insteadOf"
          echo "GIT_CONFIG_VALUE_${index}=${prefix}"
          echo "GIT_CONFIG_COUNT=$((index + 1))"
        } >> "$GITHUB_ENV"
