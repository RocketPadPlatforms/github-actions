name: "Jsonnet Format Check"
description: >
  Runs `jsonnetfmt -i` over a directory tree of Jsonnet/libsonnet files and
  fails if it produced any changes, i.e. enforces that all committed files
  are already correctly formatted.
inputs:
  path:
    description: "Root directory to search for Jsonnet files."
    required: false
    default: "."
  exclude-path:
    description: "A `find -not -path` glob to exclude (e.g. vendored dependencies)."
    required: false
    default: "./deps/*"
  jsonnet-version:
    description: "go-jsonnet release version to install, without the leading 'v'. Leave empty to use setup-jsonnet's default."
    required: false
runs:
  using: "composite"
  steps:
    - if: inputs.jsonnet-version != ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
      with:
        version: ${{ inputs.jsonnet-version }}
    - if: inputs.jsonnet-version == ''
      uses: RocketPadPlatforms/github-actions/actions/setup-jsonnet@v1
    - shell: bash
      run: |
        set -euo pipefail
        files=$(find "${{ inputs.path }}" -name '*.*sonnet' -not -path "${{ inputs.exclude-path }}")

        {
          echo "## Jsonnet Format Check"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -z "$files" ]; then
          echo "No Jsonnet files found to format."
          echo "No Jsonnet files found to format." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "$files" | xargs jsonnetfmt -i

        changed_files=$(git diff --name-only -- .)
        if [ -n "$changed_files" ]; then
          git -c color.ui=always diff
          {
            echo "❌ $(echo "$changed_files" | wc -l) file(s) need reformatting:"
            echo
            echo "$changed_files" | sed 's/^/- `/;s/$/`/'
            echo
            echo "Run \`jsonnetfmt -i\` locally and commit the changes."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "✅ All files already formatted correctly." >> "$GITHUB_STEP_SUMMARY"
