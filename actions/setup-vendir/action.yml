name: "Setup vendir"
description: >
  Installs vendir (carvel-dev/vendir) from its official GitHub release
  binaries and adds it to PATH. No container image required.
inputs:
  version:
    description: "vendir release version to install, without the leading 'v' (e.g. 0.46.0)."
    required: false
    default: "0.46.1"
runs:
  using: "composite"
  steps:
    - name: Install vendir ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"

        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          *)
            echo "::error::Unsupported architecture: $arch" >&2
            exit 1
            ;;
        esac

        url="https://github.com/carvel-dev/vendir/releases/download/v${version}/vendir-${os}-${arch}"
        echo "Downloading ${url}"
        curl -fsSL -o /tmp/vendir "${url}"
        sudo install -m 0755 /tmp/vendir /usr/local/bin/vendir
        rm -f /tmp/vendir

    - name: Verify installation
      shell: bash
      run: vendir version
